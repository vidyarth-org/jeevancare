<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JC Network</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    display: none;
}

/* Heading */
h1 {
    text-align: center;
    margin-top: 30px;
    letter-spacing: 1px;
}

/* Buttons container */
.docs-container {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

/* Buttons */
.docs-container button {
    width: 260px;
    padding: 14px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2ea0c5;
    color: #fff;
}

.docs-container button:hover {
    background: #055ec4;
}

/* Floating Exit Button */
#exitBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #e60000;
    color: #ffffff;
    padding: 14px 22px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    z-index: 10000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    user-select: none;
}

#exitBtn:hover {
    background: #b30000;
}
</style>
</head>

<body>

<h1>JC Network</h1>

<div class="docs-container">
    <!-- Replace # with your real links later -->
    <button onclick="redirectTo('https://www.jeevandayee.gov.in/MJPJAY/FrontServlet?requestType=CommonRH&actionVal=HomepageStats&pageName=4')">Jeevandayee</button>
    <button onclick="redirectTo('https://www.scribd.com/document/806908704/MJPJAY-Hospital-List')">Scribd</button>
    <button onclick="redirectTo('#')">CSR</button>
</div>

<!-- Exit Button -->
<div id="exitBtn" onclick="exitPage()">EXIT</div>

<script>
/* ======================
   LOGIN PROTECTION
====================== */
(function () {
    const correctID = "jcadmin";
    const correctPassword = "jc@2026";

    const userID = prompt("Enter ID:");
    const userPass = prompt("Enter Password:");

    if (userID === correctID && userPass === correctPassword) {
        document.body.style.display = "block";
    } else {
        alert("Access Denied");
        document.body.innerHTML = "";
        document.body.style.display = "none";
    }
})();

/* ======================
   REDIRECT FUNCTION
====================== */
function redirectTo(url) {
    window.location.href = url;
}

/* ======================
   EXIT FUNCTION
====================== */
function exitPage() {
    window.location.href = "https://www.jeevan.care/";
}

/* ======================
   BLOCK INSPECT & CLICKS
====================== */
document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", function (e) {
    if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
        (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U
    ) {
        e.preventDefault();
        return false;
    }
});
</script>

</body>
</html>
