<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Verification Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .redirect-box {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 90%;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .countdown {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
            margin: 10px 0;
        }

        p {
            color: #555;
            font-size: 14px;
        }

        a {
            color: #d9534f;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="redirect-box">
    <h2>Please wait</h2>
    <p>You are being redirected to the verification panel.</p>

    <div class="countdown" id="timer">3</div>

    <p>
        If you are not redirected automatically,
        <a href="https://jeevancare.kesug.com/JeevanCare/verify.php">
            click here
        </a>.
    </p>
</div>

<script>
    let timeLeft = 3;
    const timerElement = document.getElementById("timer");
    const redirectURL = "https://jeevancare.kesug.com/JeevanCare/verify.php";

    const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            window.location.href = redirectURL;
        }
    }, 1000);
</script>

</body>
</html>
